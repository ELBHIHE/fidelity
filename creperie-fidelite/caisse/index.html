<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Caisse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap"><link rel="stylesheet" href="/assets/base.css"><link rel="stylesheet" href="/caisse/caisse.css"></head><body>
<div class="wrap">
<div class="top"><div class="logo"><i></i>Caisse</div><button class="btn ghost" id="verrou">Verrouiller</button></div>
<section class="zone" id="lock">
  <h2>Code caissier</h2>
  <label for="pin">Saisissez le code pour commencer</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn" id="ouvrir">Ouvrir la caisse</button><p class="msg err" id="perr"></p>
</section>
<section class="zone" id="work" hidden>
  <button class="btn sec" id="scan">Scanner la carte du client</button>
  <div id="cam" hidden><video id="video" playsinline muted></video><button class="btn ghost" id="stopscan">Annuler</button></div>
  <p class="ou">ou saisir le numéro</p>
  <label for="tel">Téléphone du client</label><input id="tel" type="tel" placeholder="06 12 34 56 78">
  <div class="actions"><button class="btn" id="tampon">Ajouter un tampon</button><button class="btn cit" id="reward">Valider la crêpe offerte</button></div>
  <p class="msg" id="msg"></p>
  <div id="res" hidden><b id="nom"></b><div class="dots" id="dots"></div><p id="score"></p></div>
</section>
</div><script src="/assets/jsQR.js"></script><script src="/caisse/caisse.js"></script></body></html>
