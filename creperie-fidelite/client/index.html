<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma carte fidélité</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap"><link rel="stylesheet" href="/assets/base.css"><link rel="stylesheet" href="/client/client.css"></head><body>
<header><div class="logo"><i></i>La Crêperie</div><h1>Votre carte fidélité</h1><p>Cumulez des tampons : une crêpe vous est offerte.</p></header>
<main>
<section class="panel" id="form">
  <label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name">
  <label for="tel">Numéro de téléphone</label><input id="tel" type="tel" autocomplete="tel" placeholder="06 12 34 56 78">
  <label for="naiss">Date de naissance (facultatif)</label><input id="naiss" type="date">
  <label class="chk"><input type="checkbox" id="consent">J’accepte de recevoir des offres par WhatsApp.</label>
  <button class="btn" id="go">Créer ma carte</button><p class="msg err" id="err"></p>
  <small>Votre numéro sert uniquement à retrouver votre carte et à vous envoyer des offres si vous l’acceptez.</small>
</section>
<section class="carte" id="carte" hidden>
  <h2 id="nom"></h2><p id="rec"></p><div id="stamps"></div>
  <div class="cadeau" id="cadeau" hidden></div>
  <div class="qr" id="qr"></div><p class="aide">Présentez ce code à la caisse pour recevoir votre tampon.</p>
  <button class="btn cit" id="maj">Actualiser ma carte</button>
  <button class="btn ghost" id="change">Ce n’est pas ma carte</button>
</section>
</main><script src="/assets/qrcode.js"></script><script src="/client/client.js"></script></body></html>
