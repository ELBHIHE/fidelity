<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte de fidélité – Crêperie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>Ta carte crêpes</h1><p>10 crêpes, la suivante est offerte.</p></header>
<main>
<section class="box" id="form">
  <label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name">
  <label for="tel">Téléphone</label><input id="tel" type="tel" autocomplete="tel" placeholder="06 12 34 56 78">
  <label for="naiss">Date de naissance (optionnel)</label><input id="naiss" type="date">
  <label class="chk"><input type="checkbox" id="consent"> J’accepte de recevoir des offres par WhatsApp.</label>
  <button id="go">Créer ma carte</button>
  <p class="msg err" id="err"></p>
</section>
<section class="box" id="carte" hidden>
  <h2 id="nom"></h2><div id="stamps"></div><p class="msg" id="rec"></p>
  <button class="sec" id="maj">Actualiser ma carte</button>
</section>
</main><script src="js/client.js"></script></body></html>
